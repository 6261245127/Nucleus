version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: creatorboost_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-creatorboost}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - creatorboost_net

  redis:
    image: redis:7-alpine
    container_name: creatorboost_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - creatorboost_net

volumes:
  pgdata:
  redisdata:

networks:
  creatorboost_net:
    driver: bridge
